<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fitness Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18201B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fitness Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
</head>
<body>
  <header>
    <div class="wrap">
      <div class="hrow">
        <h1 class="brand">Fitness<span>Log</span></h1>
        <div class="datenav" id="datenav" hidden>
          <button class="btn icon" id="prev" aria-label="Previous day">‹</button>
          <input type="date" id="date" aria-label="Date">
          <button class="btn icon" id="next" aria-label="Next day">›</button>
          <button class="btn" id="todayBtn">Today</button>
        </div>
      </div>
      <nav class="tabs" role="tablist" id="tabs" hidden>
        <button class="tab" role="tab" data-tab="today" aria-selected="true">Day</button>
        <button class="tab" role="tab" data-tab="trends" aria-selected="false">Trends</button>
        <button class="tab" role="tab" data-tab="plan" aria-selected="false">Plan &amp; goals</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="banner" class="banner" hidden></div>
    <section id="v-login" hidden>
      <form class="card login" id="loginForm">
        <h2>Sign in</h2>
        <p class="muted small">Paste the access key for this tracker. You stay signed in on this device for about six months.</p>
        <label class="f">Access key
          <input id="loginKey" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        </label>
        <div id="loginError" class="error small" hidden></div>
        <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
      </form>
    </section>
    <section id="v-loading" class="muted">Loading your log…</section>
    <section id="v-today" hidden></section>
    <section id="v-trends" hidden></section>
    <section id="v-plan" hidden></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
